name: Ebates
description: >-
  Ebates is a consumer cash-back and rebate shopping platform founded in 2000 in
  San Francisco that pays members a percentage of their purchases back as cash
  when they shop through its links at thousands of partner retailers. Rakuten
  acquired Ebates in 2014 and rebranded the U.S. service as Rakuten Rewards in
  2019; the ebates.com domain now redirects to rakuten.com. The business is a
  consumer-facing rewards and affiliate-commerce brand and does not operate an
  independent public developer API program. It was surfaced as a portfolio
  company of Canaan Partners and added to the API Evangelist network for
  enrichment.
